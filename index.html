<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>しばコレ マップ</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
<header>
    <h1>新発田観光マップ</h1>
</header>

<div id="categories">
    <button class="category-btn active" data-category="all">すべて</button>
    <button class="category-btn" data-category="観光">🏯 観光</button>
    <button class="category-btn" data-category="グルメ">🍴 グルメ</button>
    <button class="category-btn" data-category="交通">🚉 交通</button>
    <button class="category-btn" data-category="公共施設">🏛 公共施設</button>
</div>

<div id="info">
    地図上のピンをタップしてください。
</div>

<div id="map"></div>

<button id="locationButton">
    ◎
</button>

<button id="rotateButton">
    ↻
</button>
